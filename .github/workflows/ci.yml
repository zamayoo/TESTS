name: TESTS quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Check browser JavaScript syntax
        run: |
          node --check dist/app.js
          node --check dist/account.js

      - name: Run server and dataset tests
        run: python -m unittest discover -s tests -v

      - name: Check repository diff hygiene
        run: git diff --check

  voice-container:
    name: Build offline voice container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build application and Ukrainian TTS image
        run: docker build --progress=plain -f server/Dockerfile -t tests-voice-check .
